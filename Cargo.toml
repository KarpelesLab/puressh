[package]
name = "puressh"
version = "0.2.7"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "A pure-Rust SSH (Secure Shell) protocol library, in the spirit of libssh, built on purecrypto."
repository = "https://github.com/KarpelesLab/puressh"
documentation = "https://docs.rs/puressh"
readme = "README.md"
keywords = ["ssh", "ssh2", "crypto", "network", "no-std"]
categories = ["cryptography", "network-programming"]
# Cargo's auto-discovery scans `src/bin/` for `.rs` files and turns each one
# into a binary. We list every binary explicitly below; turning auto-discovery
# off lets us drop shared helpers in `src/bin/common.rs` (pulled in via
# `#[path = "common.rs"] mod common;`) without Cargo trying to compile them
# as a standalone binary.
autobins = false

[features]
# The defaults are what a client-library consumer needs. The server side
# (`server`, `pam`) and the agent daemon (`agent`) are opt-in; the release
# builds of the binaries enable all three.
default = ["std", "client", "compress", "multichannel", "knock", "security-key", "pkcs11"]
std = ["purecrypto/std", "alloc"]
alloc = ["purecrypto/alloc"]
# High-level client and server APIs depend on `std::net` / `std::io` /
# `std::thread`, so they require the `std` feature.
client = ["std"]
# The server is the one part of the library that needs `nix` (fork, ptys,
# setuid, signals, ...). The client stays sans-IO underneath and leaves the
# I/O model to its caller.
server = ["std", "dep:nix"]
compress = ["dep:compcol"]
# Concurrent multi-channel client layer (SharedClient, OwnedChannelStream,
# SftpSession). Enables several SFTP / exec / shell / direct-tcpip handles
# to coexist on one connection with per-channel fairness (Condvar-based
# pumper-or-wait) and per-channel backpressure (window credit deferred to
# drain). Default on; turning it off keeps the borrow-based Client API and
# strips ~600 lines of code from `src/shared.rs`.
multichannel = ["client"]
# FIDO security keys (`sk-ecdsa`, `sk-ed25519`) on the authenticator side:
# signing, enrolment and resident keys through an OpenSSH
# `SecurityKeyProvider` library or `internal` (libfido2), both loaded at run
# time with `dlsym`, so there is no link-time dependency. Verifying their
# signatures needs no feature. Default on.
security-key = ["std", "dep:dlsym"]
# PKCS#11 tokens (`PKCS11Provider`, `ssh -I`, `ssh-keygen -D`, `ssh-add
# -s`): a module loaded at run time with `dlsym`. Default on.
pkcs11 = ["std", "dep:dlsym"]
# Stealth UDP rendezvous ("knock", `docs/knock.md`): a signed UDP datagram
# opens a one-shot TCP listener in front of a regular SSH session. puressh
# only; not understood by other SSH implementations. Default on.
knock = ["std"]
# The agent daemon side (`agent::AgentState`, the `ssh-agent` binary), which
# needs `nix` for peer credentials and daemonising. The agent *client* (keys
# in an agent for authentication, `ssh-add`) is always there.
agent = ["std", "dep:nix"]
# C ABI surface. Requires `std`, the `client` module, and the multi-channel
# layer (the FFI's PcSshSftp / PcSshAgent depend on `SharedClient`). Produces
# additional `staticlib` / `cdylib` artefacts (see `[lib].crate-type`).
ffi = ["std", "client", "multichannel"]
# Runtime-agnostic async client frontend (`AsyncClient`), driving the same
# sans-IO `ClientDriver` as the blocking `Client` over any
# `futures_io::AsyncRead + AsyncWrite` transport (tokio via compat, smol,
# async-std, …). Default-off; pulls in `futures-util` only when enabled.
async = ["std", "client", "dep:futures-util"]
# Native tokio frontend. Builds on the runtime-agnostic `async` core and adds
# `connect_tokio` / `accept_tokio` constructors that accept tokio's own
# `AsyncRead`/`AsyncWrite` streams (e.g. `tokio::net::TcpStream`) directly,
# bridged to the `futures` traits with tokio-util's compat shim. No tokio
# runtime is pulled into the library; the caller owns the runtime.
tokio = ["async", "dep:tokio", "dep:tokio-util"]
# Native mio frontend (readiness/non-blocking). The `MioClient` drives the
# sans-IO `ClientDriver` over any `std::io::Read + Write` whose `WouldBlock`
# signals readiness — which `mio::net::TcpStream` is — so the library needs no
# dependency on `mio` itself; callers register the stream in their own `Poll`.
mio = ["client"]
# PAM session integration for the `sshd` binary; implies `server`. Opt-in:
# without it there is no libpam runtime dep. The dep itself is also gated to
# Linux, so other builds stay clean.
pam = ["server", "dep:dlsym"]

[dependencies]
# `libc` for the few low-level POSIX bits: constants the library passes to
# std (`O_NOFOLLOW`, termios mode numbers), and the binaries' own calls
# (terminal control, fork, peer credentials) where they don't use `nix`. The
# library calls into it only to free what a loaded security-key provider or
# PKCS#11 module allocated (its `free`, on every platform).
libc = { version = "0.2", default-features = false }
# Run-time loading of libpam, FIDO providers and libfido2, and PKCS#11
# modules (none is a link-time dependency).
dlsym = { version = "0.0.2", optional = true }
# 0.7 made `ec` stop implying `alloc`, so the boxed multi-curve path, `CurveId`
# and every DER/PEM codec now need `alloc` named explicitly. We already name it
# (our own `alloc` feature forwards to `purecrypto/alloc`, and `std` implies
# `alloc`), so the break is a no-op here — but a `no_std` consumer that enabled
# only `purecrypto/ec` would lose those items.
#
# 0.8's only break is an MSRV raise to Rust 1.89, which is why this crate's
# `rust-version` moved with it. The floor is a patch release rather than 0.8
# because the patch line carries security fixes we want as a minimum, not
# merely as whatever a fresh resolve happens to pick: 0.8.1 brought a broad
# constant-time / zeroization audit across EC, RSA, Falcon and the AEADs;
# 0.8.2 tightened RSA key-import validation and wiped private-op scratch,
# bounded custom DH-group validation (our `diffie-hellman-group-exchange`
# path), and zeroized ChaCha20, ML-KEM and X25519 stack temporaries; 0.8.3
# only touches DTLS/QUIC/Falcon but is the current tip of that line.
#
# 0.9's breaking changes are confined to TLS, QUIC, X.509 and LMS/HSS, none of
# which this crate enables; the MSRV stays at Rust 1.89.
#
# 0.10's only break is TLS's `Readiness::from_raw_fd` becoming `unsafe`, which
# we don't enable. Its non-TLS fixes include rejecting partial blocks in
# `BlockCipher::{encrypt,decrypt}_blocks` (our CBC path goes through the `Cbc`
# mode, which already errors on misaligned input) and keeping secret bignum
# limbs off the heap in RSA blinding; the MSRV stays at Rust 1.89.
purecrypto = { version = "0.10", default-features = false, features = [
    "hash", "cipher", "mac", "kdf", "rng", "rsa", "dh", "ec", "der", "mlkem", "mldsa",
] }
# 0.6.10 minimum, not just 0.6: 0.6.9 fixed the zlib/deflate decoder reporting
# `StreamEnd` instead of stalling on trailing bytes, and 0.6.10 extended that to
# the other terminal states. `src/compress/zlib.rs` drives the decoder to a
# terminal status once per SSH packet, so a stall there is a hang, not a slow
# path. The 0.6 break (`EncoderConfig`/`DecoderConfig` became `non_exhaustive`)
# doesn't reach us: we construct both codecs with `new()` and no config literal.
#
# 0.7 only adds the allocation-free `embed` deflate family behind its own
# feature, which we don't enable; the `zlib` streaming codecs are unchanged and
# its MSRV (Rust 1.88) stays below ours.
compcol = { version = "0.7", default-features = false, features = ["alloc", "zlib"], optional = true }
# Runtime-agnostic async I/O traits (`AsyncRead`/`AsyncWrite`) plus their
# `read`/`write_all` combinators, used only by the optional `async` frontend.
futures-util = { version = "0.3", default-features = false, features = ["io"], optional = true }
# The `tokio` feature needs tokio's `AsyncRead`/`AsyncWrite` traits to bound the
# `connect_tokio`/`accept_tokio` constructors, and tokio-util's `compat` shim to
# bridge them to the `futures` traits the async core speaks. `default-features
# = false` keeps it to the io traits — no runtime, reactor, or scheduler is
# linked into the library; the caller owns the tokio runtime (see dev-deps).
tokio = { version = "1", default-features = false, optional = true }
tokio-util = { version = "0.7", default-features = false, features = ["compat"], optional = true }

# Unix-only deps for the server side (the `server` library code and the
# `sshd` binary: fork(), forkpty(), waitpid(), set_winsize(), SIGCHLD
# plumbing, ...) and the `ssh-agent` binary (the `agent` feature). Optional,
# so a client-only build never pulls it in, and confined to `cfg(unix)` so
# Windows builds keep a clean dependency graph.
#
# Feature map in nix 0.30:
#   process — waitpid, fork, execvp
#   signal  — signal handlers, kill
#   term    — pty / forkpty / Winsize (the pty module is gated by `term`)
#   fs      — fcntl flags / O_NONBLOCK, statvfs (SFTP server)
#   ioctl   — TIOCSWINSZ
#   user    — User::from_name, setuid/setgid/initgroups, geteuid/getegid
#   poll    — poll(2) for the tunnel-device reader and the server's waits
#   socket, net — sshd listeners (IPV6_V6ONLY so `[::]` and `0.0.0.0` bind
#             side by side, as OpenSSH does), ssh-agent peer credentials
#
# 0.31's breaking changes (removal of `PartialEq` on `SigHandler` and of a
# NetBSD `IFF_NOTRAILERS` flag; libc floor 0.2.181) touch nothing we use.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, optional = true, features = [
    "process", "signal", "term", "fs", "ioctl", "user", "poll", "socket", "net",
] }

# The sshd PAM integration's `dlsym` dependency is declared with the others
# (it loads libpam at run time); `sshd_pam` itself is Linux only, as it uses
# Linux-PAM's constants, which OpenPAM (macOS / *BSD) numbers differently.

[dev-dependencies]
hex = "0.4"
# Real runtimes used only to exercise the native frontends in tests:
# `--features tokio` drives `connect_tokio` on a tokio runtime; `--features mio`
# drives the readiness frontend in a mio `Poll` loop. Neither is a library dep.
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util"] }
mio = { version = "1", default-features = false, features = ["net", "os-poll"] }

[lib]
name = "puressh"
path = "src/lib.rs"
# Default builds emit only the rlib. The C ABI surface (staticlib / cdylib)
# is built explicitly via `cargo rustc --crate-type` — see the `c_abi` and
# `release-binaries` workflows — so it isn't tied to every `cargo build`.
# Keeping the default set to just `["lib"]` lets `cargo build` succeed in
# no_std + alloc mode, where the C ABI artefacts would otherwise require
# a #[panic_handler] and #[global_allocator] the library doesn't provide.
crate-type = ["lib"]

[[bin]]
name = "ssh"
path = "src/bin/ssh.rs"
# `multichannel` is needed for the interactive shell path — it spins a
# sibling `SharedClient` clone to deliver SIGWINCH-driven `window-change`
# requests while the stdio threads hold the channel stream.
required-features = ["std", "client", "multichannel"]

[[bin]]
name = "sshd"
path = "src/bin/sshd.rs"
required-features = ["std", "server"]

[[bin]]
name = "ssh-keygen"
path = "src/bin/ssh-keygen.rs"
required-features = ["std"]

[[bin]]
name = "ssh-add"
path = "src/bin/ssh-add.rs"
required-features = ["std", "client"]

[[bin]]
name = "ssh-agent"
path = "src/bin/ssh-agent.rs"
required-features = ["std", "agent"]

[[bin]]
name = "ssh-keyscan"
path = "src/bin/ssh-keyscan.rs"
required-features = ["std", "client"]

[[bin]]
name = "sftp"
path = "src/bin/sftp.rs"
required-features = ["std", "client"]

[[bin]]
name = "scp"
path = "src/bin/scp.rs"
required-features = ["std", "client"]

# Integration tests that spawn the in-tree `sshd` need the `server` feature
# to have it built (it is off by default); without it they are skipped.

[[test]]
name = "agent_cli"
required-features = ["agent"]

[[test]]
name = "e2e_auth_command"
required-features = ["server"]

[[test]]
name = "e2e_forwarding"
required-features = ["server"]

[[test]]
name = "e2e_hostkeys"
required-features = ["server"]

[[test]]
name = "e2e_knock"
required-features = ["server"]

[[test]]
name = "e2e_legacy_algos"
required-features = ["server"]

[[test]]
name = "e2e_mux"
required-features = ["server"]

[[test]]
name = "e2e_scp"
required-features = ["server"]

[[test]]
name = "e2e_server_compression"
required-features = ["server"]

[[test]]
name = "e2e_sshd_inetd"
required-features = ["server"]

[[test]]
name = "e2e_sshd_log"
required-features = ["server"]

[[test]]
name = "e2e_transfer"
required-features = ["server"]

[[test]]
name = "e2e_tunnel"
required-features = ["server"]

[[test]]
name = "sshd_dump"
required-features = ["server"]
