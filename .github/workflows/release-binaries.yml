name: Release binaries

# Fires whenever a GitHub Release is published. release-plz creates the
# release on its own (see release-plz.yml); this workflow attaches cross-built
# `ssh` and `sshd` binaries to it.
#
# Also exposed via workflow_dispatch so a failed asset upload can be retried
# against an existing release without re-tagging.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload to (e.g. v0.0.3)"
        required: true
        type: string

permissions:
  # gh release upload needs to attach assets.
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Resolve the target tag once — `release` and `workflow_dispatch` use
  # different paths in the event payload.
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            asset_suffix: windows-x86_64
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            archive: zip
            asset_suffix: windows-aarch64

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build CLI binaries and C library
        shell: bash
        run: |
          cargo build --release --features server,pam,agent --bin ssh  --target ${{ matrix.target }}
          cargo build --release --features server,pam,agent --bin sshd --target ${{ matrix.target }}
          cargo rustc --lib --release --features ffi --crate-type staticlib --target ${{ matrix.target }}
          cargo rustc --lib --release --features ffi --crate-type cdylib    --target ${{ matrix.target }}

      - name: Stage archive contents
        shell: bash
        run: |
          mkdir -p staging/bin staging/lib staging/include
          cp README.md staging/
          cp include/puressh.h staging/include/
          # LICENSE is optional — copy if present.
          [[ -f LICENSE ]] && cp LICENSE staging/ || true
          td="target/${{ matrix.target }}/release"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "$td/ssh.exe"  staging/bin/
            cp "$td/sshd.exe" staging/bin/
            cp "$td/puressh.lib"     staging/lib/ 2>/dev/null || true  # static library
            cp "$td/puressh.dll"     staging/lib/ 2>/dev/null || true  # shared library
            cp "$td/puressh.dll.lib" staging/lib/ 2>/dev/null || true  # import library for the DLL
          else
            cp "$td/ssh"  staging/bin/
            cp "$td/sshd" staging/bin/
            cp "$td/libpuressh.a" staging/lib/
            cp "$td"/libpuressh.so    staging/lib/ 2>/dev/null || true  # Linux
            cp "$td"/libpuressh.dylib staging/lib/ 2>/dev/null || true  # macOS
          fi
          ls -R staging

      - name: Pack archive
        id: pack
        shell: bash
        run: |
          name="puressh-${TAG}-${{ matrix.asset_suffix }}"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            asset="${name}.zip"
            (cd staging && 7z a "../${asset}" *)
          else
            asset="${name}.tar.gz"
            tar -C staging -czf "${asset}" .
          fi
          echo "asset=${asset}" >> "$GITHUB_OUTPUT"

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${TAG}" "${{ steps.pack.outputs.asset }}" --clobber

  # Linux: built inside ubuntu:20.04 (glibc 2.31) on native amd64 / arm64
  # runners, so one binary runs on Ubuntu 20.04, 22.04, 24.04 and newer.
  # The container has no gh CLI; `publish-linux` packs and uploads.
  build-linux:
    name: build linux ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    container: ubuntu:20.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, arch: amd64, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, arch: arm64, target: aarch64-unknown-linux-gnu }
    steps:
      - name: Install build tools
        run: >
          apt-get update &&
          DEBIAN_FRONTEND=noninteractive apt-get install -y
          curl ca-certificates build-essential git libpam0g-dev

      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build CLI binaries and C library
        run: |
          for bin in ssh sshd ssh-keygen sftp scp ssh-add ssh-agent ssh-keyscan; do
            cargo build --release --features server,pam,agent --bin "$bin"
          done
          cargo rustc --lib --release --features ffi --crate-type staticlib
          cargo rustc --lib --release --features ffi --crate-type cdylib

      - name: Stage
        run: |
          mkdir -p staging/bin staging/lib staging/include
          for bin in ssh sshd ssh-keygen sftp scp ssh-add ssh-agent ssh-keyscan; do
            cp "target/release/$bin" staging/bin/
          done
          cp scripts/ssh-copy-id staging/bin/
          cp target/release/libpuressh.a target/release/libpuressh.so staging/lib/
          cp include/puressh.h staging/include/
          cp README.md staging/
          [ -f LICENSE ] && cp LICENSE staging/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: staging/

  publish-linux:
    name: publish linux tarballs and Ubuntu packages
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Pack tarballs and build .deb packages
        run: |
          version="${TAG#v}"
          mkdir -p out
          for arch in amd64 arm64; do
            dir="artifacts/linux-$arch"
            chmod 755 "$dir"/bin/*
            case "$arch" in amd64) suffix=x86_64 ;; arm64) suffix=aarch64 ;; esac
            tar -C "$dir" -czf "out/puressh-${TAG}-linux-${suffix}.tar.gz" .
            for release in focal jammy noble; do
              packaging/deb/build-deb.sh "$release" "$arch" "$version" "$dir/bin" out
            done
            packaging/deb/build-client-deb.sh "$arch" "$version" "$dir/bin" out
          done
          ls -l out

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${TAG}" out/* --clobber

  # Rebuild the GitHub Pages apt repository from the .deb assets publish-linux
  # just uploaded, so `apt install puressh-server` works on Ubuntu. Skips
  # itself (no failure) until the APT_GPG_PRIVATE_KEY signing secret is set;
  # see packaging/apt/README.md for the one-time setup.
  publish-apt:
    name: publish apt repository
    needs: publish-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check for signing key
        id: check
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$APT_GPG_PRIVATE_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "APT_GPG_PRIVATE_KEY is not set; skipping apt repository publish." >&2
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install reprepro
        if: steps.check.outputs.enabled == 'true'
        run: sudo apt-get update && sudo apt-get install -y reprepro

      - name: Import signing key
        if: steps.check.outputs.enabled == 'true'
        id: gpg
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME" && chmod 700 "$GNUPGHOME"
          echo "allow-loopback-pinentry" > "$GNUPGHOME/gpg-agent.conf"
          echo "pinentry-mode loopback"  > "$GNUPGHOME/gpg.conf"
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          keyid=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')
          if [ -z "$keyid" ]; then echo "no key imported" >&2; exit 1; fi
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "keyid=$keyid" >> "$GITHUB_OUTPUT"

      - name: Download .deb assets from the release
        if: steps.check.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p debs
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir debs
          ls -l debs

      - name: Check out existing gh-pages (or start it)
        if: steps.check.outputs.enabled == 'true'
        run: |
          url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          if git clone --depth 1 --branch gh-pages "$url" site 2>/dev/null; then
            echo "cloned existing gh-pages"
          else
            echo "gh-pages does not exist yet; creating it"
            mkdir -p site
            git -C site init -q
            git -C site remote add origin "$url"
            git -C site checkout -q --orphan gh-pages
          fi

      - name: Build the repository with reprepro
        if: steps.check.outputs.enabled == 'true'
        env:
          KEYID: ${{ steps.gpg.outputs.keyid }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          repo="$PWD/site"

          mkdir -p "$repo/conf"
          sed "s/@KEYID@/$KEYID/g" packaging/apt/distributions.in > "$repo/conf/distributions"

          # Idempotent: drop any prior entries, then add this release's.
          for suite in focal jammy noble; do
            reprepro -b "$repo" remove "$suite" puressh-server puressh-client >/dev/null 2>&1 || true
          done

          shopt -s nullglob
          # Server packages are suite-specific (~ubuntuNN in the version).
          for deb in debs/puressh-server_*.deb; do
            case "$deb" in
              *~ubuntu20.04_*) suite=focal ;;
              *~ubuntu22.04_*) suite=jammy ;;
              *~ubuntu24.04_*) suite=noble ;;
              *) echo "skipping unrecognised server package: $deb" >&2; continue ;;
            esac
            reprepro -b "$repo" includedeb "$suite" "$deb"
          done
          # The client package is suite-agnostic: publish it into every suite.
          for deb in debs/puressh-client_*.deb; do
            for suite in focal jammy noble; do
              reprepro -b "$repo" includedeb "$suite" "$deb"
            done
          done

          # Publish the public key and a landing page.
          gpg --armor --export "$KEYID" > "$repo/puressh-archive-keyring.asc"
          owner_lc=$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
          pages_url="https://${owner_lc}.github.io/${GITHUB_REPOSITORY#*/}"
          sed "s#@PAGES_URL@#${pages_url}#g" packaging/apt/index.html.in > "$repo/index.html"
          # GitHub Pages skips files under directories starting with "_"; none
          # here, but disable Jekyll processing to be safe.
          touch "$repo/.nojekyll"

      - name: Commit and push gh-pages
        if: steps.check.outputs.enabled == 'true'
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "apt repository unchanged for ${TAG}"
          else
            git commit -m "apt: publish ${TAG}"
            git push origin gh-pages
          fi

  build-macos-universal:
    name: build macos universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-universal

      - name: Build both Apple slices (CLI + C library)
        run: |
          for t in x86_64-apple-darwin aarch64-apple-darwin; do
            cargo build --release --features server,pam,agent --bin ssh  --target "$t"
            cargo build --release --features server,pam,agent --bin sshd --target "$t"
            cargo rustc --lib --release --features ffi --crate-type staticlib --target "$t"
            cargo rustc --lib --release --features ffi --crate-type cdylib    --target "$t"
          done

      - name: Lipo into universal artifacts
        run: |
          mkdir -p staging/bin staging/lib staging/include
          for bin in ssh sshd; do
            lipo -create -output "staging/bin/$bin" \
              "target/x86_64-apple-darwin/release/$bin" \
              "target/aarch64-apple-darwin/release/$bin"
          done
          lipo -create -output staging/lib/libpuressh.a \
            target/x86_64-apple-darwin/release/libpuressh.a \
            target/aarch64-apple-darwin/release/libpuressh.a
          lipo -create -output staging/lib/libpuressh.dylib \
            target/x86_64-apple-darwin/release/libpuressh.dylib \
            target/aarch64-apple-darwin/release/libpuressh.dylib
          cp include/puressh.h staging/include/
          cp README.md staging/
          [[ -f LICENSE ]] && cp LICENSE staging/ || true
          file staging/bin/ssh staging/bin/sshd staging/lib/libpuressh.*

      - name: Pack archive
        id: pack
        run: |
          asset="puressh-${TAG}-macos-universal.tar.gz"
          tar -C staging -czf "${asset}" .
          echo "asset=${asset}" >> "$GITHUB_OUTPUT"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${TAG}" "${{ steps.pack.outputs.asset }}" --clobber
