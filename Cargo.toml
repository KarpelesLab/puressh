[package]
name = "puressh"
version = "0.0.1"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "A pure-Rust SSH (Secure Shell) protocol library, in the spirit of libssh, built on purecrypto."
repository = "https://github.com/KarpelesLab/puressh"
documentation = "https://docs.rs/puressh"
readme = "README.md"
keywords = ["ssh", "ssh2", "crypto", "network", "no-std"]
categories = ["cryptography", "network-programming"]

[features]
default = ["std", "client", "server", "compress"]
std = ["purecrypto/std", "alloc"]
alloc = ["purecrypto/alloc"]
client = []
server = []
compress = ["dep:miniz_oxide"]

[dependencies]
purecrypto = { version = "0.2", default-features = false, features = [
    "hash", "cipher", "kdf", "rng", "rsa", "dh", "ec", "der",
] }
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"], optional = true }

[dev-dependencies]
hex = "0.4"

[lib]
name = "puressh"
path = "src/lib.rs"

[[bin]]
name = "ssh"
path = "src/bin/ssh.rs"
required-features = ["std", "client"]

[[bin]]
name = "sshd"
path = "src/bin/sshd.rs"
required-features = ["std", "server"]
