name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # `ubuntu-24.04-arm`: native arm64 (free for public repos), so the
        # aarch64 build is tested with PAM like x86_64.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Format
        if: runner.os == 'Linux' # formatting is platform-independent
        run: cargo fmt --all --check

      - name: Clippy (all features, warnings denied)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test (all features)
        run: cargo test --all-features

  interop:
    name: OpenSSH interop (real sshd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: interop

      # The interop tests spawn the system `sshd` (client-mode tests) and use
      # `ssh-keygen`; both come from the OpenSSH packages. The runner ships
      # the client but not always the server.
      - name: Install OpenSSH server + client
        run: sudo apt-get update && sudo apt-get install -y openssh-server openssh-client

      # A non-root sshd still fatals without its privilege-separation
      # directory; a fresh runner that never started the ssh service may not
      # have created it.
      - name: Ensure sshd privilege-separation dir exists
        run: sudo mkdir -p /run/sshd

      # These tests are `#[ignore]` by default (they need a real sshd), so the
      # normal `cargo test` job skips them. Run the deterministic ones here,
      # single-threaded so spawned sshd instances don't contend.
      #
      # client mode (puressh client ↔ real sshd): `exec_against_real_sshd`
      # (baseline) and `compression_zlib_interop_against_real_sshd` (the
      # `zlib@openssh.com` round-trip — our guard against the inflate-truncation
      # class of bug). The `interactive_shell_…chaff` test is excluded: it is
      # timing-sensitive and unsuitable for gating. `no_more_sessions_…` checks
      # how sshd answers a session opened after `no-more-sessions@openssh.com`
      # (what our sshd mirrors).
      - name: Run client-mode compression interop against real sshd
        run: >
          cargo test --test e2e_real_sshd --
          --ignored --test-threads=1 --nocapture
          exec_against_real_sshd compression_zlib_interop_against_real_sshd
          no_more_sessions_against_real_sshd

      # Re-key interop (RFC 4253 §9). These force frequent re-keys via tiny
      # `RekeyLimit` / client `RekeyPolicy` and assert the stream survives.
      # `compressed_rekey_…` is the regression guard for the compression-context
      # reset bug (RFC 4253 §6.2): with `zlib@openssh.com` on, a re-key must
      # re-initialize the DEFLATE stream on both sides or inflate desyncs.
      # `concurrent_write_…` / `idle_sharedclient_…` cover the `SharedClient`
      # (mux) paths a forwarding tunnel uses.
      - name: Run re-key interop against real sshd
        run: >
          cargo test --test e2e_real_sshd --
          --ignored --test-threads=1 --nocapture
          server_initiated_rekey_against_real_sshd
          client_initiated_rekey_against_real_sshd
          simultaneous_rekey_against_real_sshd
          time_based_rekey_against_real_sshd
          idle_server_time_rekey_against_real_sshd
          gcm_rekey_against_real_sshd
          compressed_rekey_against_real_sshd
          concurrent_write_during_rekey_against_real_sshd
          idle_sharedclient_across_server_rekey

      # server mode (real `ssh -C` client ↔ puressh sshd): proves our server
      # advertises, activates, and drives `zlib@openssh.com` compression.
      - name: Run server-mode compression interop against real ssh client
        run: >
          cargo test --features server,pam,agent --test e2e_server_compression --
          --ignored --test-threads=1 --nocapture

      # SCP (puressh client ↔ puressh sshd), OpenSSH certificate auth
      # (puressh client ↔ real sshd), and ssh-keygen signatures/certificates
      # against OpenSSH's ssh-keygen. Neither suite ran in CI before, and both
      # had rotted into permanent failure unnoticed: `e2e_scp` could not start
      # our own sshd at all, and `e2e_cert` could not authenticate with a user
      # certificate against any sshd that sends `server-sig-algs`.
      - name: Run SCP and certificate interop
        run: >
          cargo test --features server,pam,agent --test e2e_scp --test e2e_cert --test e2e_keygen --test e2e_transfer --test e2e_auth_command --test e2e_mux --test e2e_sshd_log --test e2e_legacy_algos --test e2e_forwarding --test e2e_hostkeys --test e2e_sshd_inetd --test e2e_tunnel --
          --ignored --test-threads=1 --nocapture

      # Knock rendezvous (puressh ssh ↔ puressh sshd): the TCP port is closed,
      # so the session only comes up through the UDP knock (docs/knock.md).
      - name: Run knock rendezvous end-to-end
        run: >
          cargo test --features server,pam,agent --test e2e_knock --
          --ignored --test-threads=1 --nocapture

      # Ansible (ansible-core from PyPI) through our ssh/scp/sftp to our sshd,
      # with its own ssh arguments: every file-transfer method, one
      # ControlMaster connection per run.
      - name: Run Ansible against puressh
        run: |
          cargo build --bins --features server,pam,agent
          python3 -m venv /tmp/ansible-venv
          /tmp/ansible-venv/bin/pip install -q ansible-core
          sh tests/interop/ansible.sh target/debug /tmp/ansible-venv/bin

  # The Launchpad packages (packaging/launchpad), built as Launchpad builds
  # them: from the source package, offline, with Ubuntu's own toolchain
  # (rustc 1.91 on jammy and noble). Then the lifecycle tests on a real VM.
  deb:
    name: Ubuntu package (${{ matrix.release }} ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, release: jammy, arch: amd64 }
          - { os: ubuntu-24.04, release: noble, arch: amd64 }
          - { os: ubuntu-24.04-arm, release: noble, arch: arm64 }
          - { os: ubuntu-26.04, release: resolute, arch: amd64 }
          - { os: ubuntu-26.04-arm, release: resolute, arch: arm64 }
    steps:
      - uses: actions/checkout@v6

      - name: Install Ubuntu's toolchain and debhelper
        run: >
          sudo apt-get update &&
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
          build-essential debhelper dpkg-dev fakeroot cargo-1.91 rustc-1.91

      - name: Build the source and binary packages
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          REF=HEAD CARGO=cargo-1.91 packaging/launchpad/build-source.sh "$version" src ${{ matrix.release }}
          dpkg-source -x src/puressh_*.dsc build
          (cd build && dpkg-buildpackage -b -us -uc)
          mkdir out out-client
          mv puressh-server_*.deb out/
          mv puressh-client_*.deb out-client/

      # Real VM with systemd: stock OpenSSH -> puressh-server -> reload ->
      # purge openssh-server (host keys restored) -> back to OpenSSH.
      - name: Package lifecycle (replace OpenSSH and back)
        timeout-minutes: 20
        run: sudo packaging/deb/test/lifecycle.sh out/*.deb

      # OpenSSH's client programs diverted and restored.
      - name: Client package lifecycle
        run: sudo packaging/deb/test/client-lifecycle.sh out-client/*.deb

  # 26.10 has no GitHub runner: the same build and lifecycle tests in a
  # container booting systemd, privileged, on the disposable runner VM.
  deb-container:
    name: Ubuntu package (${{ matrix.release }} amd64, systemd container)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { release: stonking }
    steps:
      - uses: actions/checkout@v6

      - name: Boot the container
        run: |
          printf '%s\n' "FROM ubuntu:${{ matrix.release }}" \
            'RUN rm -f /usr/sbin/policy-rc.d && apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends systemd systemd-sysv dbus ubuntu-server git ca-certificates build-essential debhelper dpkg-dev fakeroot cargo rustc' \
            'STOPSIGNAL SIGRTMIN+3' 'CMD ["/sbin/init"]' > "$RUNNER_TEMP/Dockerfile"
          docker build -q -t ubuntu-systemd -f "$RUNNER_TEMP/Dockerfile" "$RUNNER_TEMP"
          docker run -d --name ub --privileged --cgroupns=private --tmpfs /run --tmpfs /run/lock \
            -v "$PWD:/src:ro" ubuntu-systemd
          for _ in $(seq 1 60); do
            case "$(docker exec ub systemctl is-system-running 2>/dev/null)" in running | degraded) break ;; esac
            sleep 1
          done
          docker exec ub systemctl is-system-running || true

      - name: Build the source and binary packages
        run: |
          docker exec ub sh -euc '
            git config --global --add safe.directory /src
            version="$(sed -n "s/^version = \"\(.*\)\"$/\1/p" /src/Cargo.toml | head -n 1)"
            REF=HEAD /src/packaging/launchpad/build-source.sh "$version" /tmp/src ${{ matrix.release }}
            cd /tmp && dpkg-source -x src/puressh_*.dsc build && cd build && dpkg-buildpackage -b -us -uc'

      - name: Package lifecycle (replace OpenSSH and back)
        timeout-minutes: 20
        run: docker exec ub sh -c 'sh /src/packaging/deb/test/lifecycle.sh /tmp/puressh-server_*.deb'

      - name: Client package lifecycle
        run: docker exec ub sh -c 'sh /src/packaging/deb/test/client-lifecycle.sh /tmp/puressh-client_*.deb'

  # GitHub has no Ubuntu 20.04 VM runners any more: build and install inside
  # an ubuntu:20.04 container (glibc 2.31, dpkg 1.19), without systemd.
  deb-focal:
    name: Ubuntu package (focal ${{ matrix.arch }}, container)
    runs-on: ${{ matrix.os }}
    container: ubuntu:20.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, arch: amd64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
    steps:
      - name: Install build tools
        run: >
          apt-get update &&
          DEBIAN_FRONTEND=noninteractive apt-get install -y
          curl ca-certificates build-essential git

      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build the server and client programs
        run: >
          cargo build --release --features server,pam,agent --bin sshd --bin ssh-keygen --bin ssh --bin scp
          --bin sftp --bin ssh-add --bin ssh-agent --bin ssh-keyscan

      - name: Build the packages
        run: |
          version="$(cargo pkgid | sed 's/.*[#@]//')"
          packaging/deb/build-deb.sh focal ${{ matrix.arch }} "$version" target/release out
          packaging/deb/build-client-deb.sh ${{ matrix.arch }} "$version" target/release out-client

      - name: Install and log in
        run: packaging/deb/test/no-systemd.sh out/*.deb

      - name: Client package lifecycle
        run: packaging/deb/test/client-lifecycle.sh out-client/*.deb

  interop-mlkem:
    name: OpenSSH interop (ML-KEM + strict KEX, built sshd 10.6p1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: interop-mlkem

      # The distro `sshd` on the runner predates `mlkem768x25519-sha256`
      # (default KEX in OpenSSH 9.9+), so client re-keys there always fall back
      # to curve25519. Build a current OpenSSH into a throwaway prefix so the
      # re-key suite actually exercises the post-quantum KEX real deployments
      # negotiate. `--with-pam` keeps `UsePAM` a recognized keyword.
      #
      # Keep this at a *recent* OpenSSH, not merely an ML-KEM-capable one. 10.4
      # enforces RFC 4253 §7.1 strictly, aborting the connection on any
      # non-transport message received mid-KEX; 10.0 tolerated it. That
      # enforcement is what caught us emitting CHANNEL_WINDOW_ADJUST during a
      # re-key, so this job only has teeth if the built sshd is strict. 10.6
      # also adds `mlkem768nistp256-sha256`, which the distro OpenSSH lacks.
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y build-essential zlib1g-dev libssl-dev libpam0g-dev

      - name: Build OpenSSH (ML-KEM capable) into a local prefix
        run: |
          set -euo pipefail
          ver=openssh-10.6p1
          curl -sSL -o "$ver.tar.gz" "https://cdn.openbsd.org/pub/OpenBSD/OpenSSH/portable/$ver.tar.gz"
          tar xzf "$ver.tar.gz"
          cd "$ver"
          ./configure --prefix="$PWD/../ossh" --with-privsep-path="$PWD/../ossh/empty" --with-pam
          make -j"$(nproc)"
          make install-nokeys
          # OpenSSH's software FIDO authenticator, for the provider tests.
          make regress/misc/sk-dummy/sk-dummy.so
          "$PWD/../ossh/sbin/sshd" -T -f /dev/null -C user=x,host=x,addr=1.2.3.4 2>/dev/null | grep -i mlkem || \
            "$PWD/../ossh/bin/ssh" -Q kex | grep -i mlkem
          sudo mkdir -p /run/sshd

      # Prepend the built binaries so the tests' `which("sshd"/"ssh-keygen")`
      # resolves to the ML-KEM build. The re-key tests then negotiate
      # `mlkem768x25519-sha256`, covering the KEX a modern server uses.
      - name: Run re-key interop against ML-KEM sshd
        run: |
          export PATH="$PWD/ossh/sbin:$PWD/ossh/bin:$PATH"
          cargo test --test e2e_real_sshd -- \
            --ignored --test-threads=1 --nocapture \
            server_initiated_rekey_against_real_sshd \
            client_initiated_rekey_against_real_sshd \
            simultaneous_rekey_against_real_sshd \
            gcm_rekey_against_real_sshd \
            compressed_rekey_against_real_sshd \
            concurrent_write_during_rekey_against_real_sshd

      # The non-default algorithms both ways against the built OpenSSH, so
      # the KEXes only it has (`mlkem768nistp256-sha256`) are exercised too.
      - name: Run algorithm interop against the built OpenSSH
        run: |
          export PATH="$PWD/ossh/sbin:$PWD/ossh/bin:$PATH"
          cargo test --features server,pam,agent --test e2e_legacy_algos -- \
            --ignored --test-threads=1 --nocapture

      # FIDO security keys through a real OpenSSH middleware library
      # (sk-dummy), and PKCS#11 through SoftHSM with an RSA, an ECDSA and an
      # Ed25519 key on its token.
      - name: Run security-key provider and PKCS#11 token tests
        run: |
          set -euo pipefail
          sudo apt-get install -y softhsm2 opensc
          mkdir -p "$PWD/hsm/tokens"
          printf 'directories.tokendir = %s/hsm/tokens\nobjectstore.backend = file\n' "$PWD" > hsm/softhsm2.conf
          export SOFTHSM2_CONF="$PWD/hsm/softhsm2.conf"
          softhsm2-util --init-token --free --label puressh --pin 1234 --so-pin 5678
          module=/usr/lib/softhsm/libsofthsm2.so
          pkcs11-tool --module "$module" -l --pin 1234 --keypairgen --key-type rsa:2048 --id 01 --label rsakey
          pkcs11-tool --module "$module" -l --pin 1234 --keypairgen --key-type EC:prime256v1 --id 02 --label eckey
          pkcs11-tool --module "$module" -l --pin 1234 --keypairgen --key-type EC:edwards25519 --id 03 --label edkey
          SK_DUMMY="$PWD/openssh-10.6p1/regress/misc/sk-dummy/sk-dummy.so" \
            PKCS11_MODULE="$module" PKCS11_PIN=1234 \
            cargo test --all-features --lib -- sk:: pkcs11:: --nocapture

  msrv:
    name: MSRV (Rust 1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Pin the exact MSRV declared in Cargo.toml (`rust-version = "1.95"`).
      # Keep this version in sync with that field. This job exists so that an
      # accidental use of a newer-than-1.95 language/std feature — or a
      # dependency bump that raises the floor (as purecrypto <=0.6.13 silently
      # did to 1.95) — fails here instead of quietly bumping the real MSRV.
      # Cargo.lock is gitignored, so dependencies resolve fresh and cargo's
      # MSRV-aware resolver picks versions compatible with 1.95.
      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@1.95

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: Check (all features, all targets) on MSRV
        run: cargo check --all-targets --all-features

      - name: Build no_std + alloc on MSRV
        run: cargo build --no-default-features --features alloc

      - name: Build all module features, no std, on MSRV
        run: cargo build --no-default-features --features "alloc,client,server"

  no_std:
    name: no_std builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build no_std + alloc (no std)
        run: cargo build --no-default-features --features alloc

      - name: Build with all module features but no std
        run: cargo build --no-default-features --features "alloc,client,server"

      # `nix` comes with the `server` and `agent` features only: the default
      # (client) build, binaries included, must not pull it in.
      - name: Default build stays free of nix
        run: |
          cargo build
          if cargo tree -e normal | grep -q ' nix v'; then
            echo "::error::nix is in the dependency graph of the default build"
            exit 1
          fi

  c_abi:
    name: C ABI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build the C library (static + shared)
        run: |
          cargo rustc --lib --release --features ffi --crate-type staticlib
          cargo rustc --lib --release --features ffi --crate-type cdylib

      - name: Compile and run the C smoke test
        run: |
          cc tests/ffi_smoke.c -I include target/release/libpuressh.a \
             -lpthread -ldl -lm -o ffi_smoke
          ./ffi_smoke

  docs:
    name: Docs build (warnings denied)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings -D rustdoc::broken-intra-doc-links
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: cargo doc --no-deps --all-features
        run: cargo doc --no-deps --all-features
